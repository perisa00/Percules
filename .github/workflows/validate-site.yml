name: Validate Percules
on:
  push:
    branches: [codex/percules-studio-worlds]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Read the exact revision
        run: |
          git init .
          git remote add origin https://github.com/perisa00/Percules.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate static site and release budget
        run: python scripts/validate_site.py
      - name: Check JavaScript syntax
        run: |
          for file in public/*.js; do node --input-type=module --check < "$file"; done
          node --check scripts/check_studio.cjs
      - name: Install shader compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
      - name: Check destinations, cameras, rendering and shaders
        run: node scripts/check_studio.cjs --shaders
